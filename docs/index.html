<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>J.A.R.V.I.S.</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 30%, #0d2847 0%, #050d17 70%);
    color: #7fdfff; min-height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  header { padding:18px; text-align:center; border-bottom:1px solid rgba(127,223,255,0.2); }
  h1 { font-size:22px; letter-spacing:6px; color:#7fdfff; text-shadow:0 0 12px #1e90ff; font-weight:300; }
  .status { font-size:12px; color:#4a90b8; margin-top:4px; letter-spacing:2px; }
  .core-wrap { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  .core {
    width:180px; height:180px; border-radius:50%;
    background: radial-gradient(circle at 50% 50%, #4dd2ff 0%, #1e90ff 40%, #0a1929 75%);
    box-shadow: 0 0 60px #1e90ff, inset 0 0 40px #7fdfff;
    transition: all 0.3s ease; position:relative;
  }
  .core::before, .core::after {
    content:''; position:absolute; inset:-20px;
    border:1px solid rgba(127,223,255,0.4); border-radius:50%;
    animation: rotate 8s linear infinite;
  }
  .core::after { inset:-40px; border-color:rgba(127,223,255,0.2); animation-duration:14s; animation-direction:reverse; }
  .core.listening {
    box-shadow: 0 0 90px #00ffcc, inset 0 0 50px #7fffee;
    background: radial-gradient(circle at 50% 50%, #00ffcc 0%, #0099ff 40%, #0a1929 75%);
    animation: pulse 1s ease-in-out infinite;
  }
  .core.speaking {
    box-shadow: 0 0 90px #ff9500, inset 0 0 50px #ffd27f;
    background: radial-gradient(circle at 50% 50%, #ffb84d 0%, #ff6a00 40%, #0a1929 75%);
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .log { flex:1; max-height:30vh; overflow-y:auto; padding:12px 16px; font-size:14px; line-height:1.5; border-top:1px solid rgba(127,223,255,0.2); }
  .log::-webkit-scrollbar { width:4px; }
  .log::-webkit-scrollbar-thumb { background:#1e90ff; border-radius:2px; }
  .msg { margin-bottom:8px; }
  .msg.user { color:#ffd27f; }
  .msg.jarvis { color:#7fdfff; }
  .msg.sys { color:#4a90b8; font-size:12px; font-style:italic; }
  .controls { display:flex; gap:10px; padding:14px; padding-bottom:max(14px, env(safe-area-inset-bottom)); background:rgba(10,25,41,0.9); border-top:1px solid rgba(127,223,255,0.2); }
  button { flex:1; padding:16px; font-size:15px; font-weight:600; letter-spacing:1px; border:1px solid #1e90ff; border-radius:12px; background:rgba(30,144,255,0.15); color:#7fdfff; cursor:pointer; transition:all 0.2s; text-transform:uppercase; }
  button:active { transform:scale(0.96); background:rgba(30,144,255,0.35); }
  button.mic { flex:2; }
  button.mic.active { background:#00ffcc; color:#0a1929; box-shadow:0 0 25px #00ffcc; }
  button.mic:disabled { opacity:0.3; }
</style>
</head>
<body>

<header>
  <h1>J.A.R.V.I.S.</h1>
  <div class="status" id="status">НАЖМИТЕ КНОПКУ И ГОВОРИТЕ</div>
</header>

<div class="core-wrap">
  <div class="core" id="core"></div>
</div>

<div class="log" id="log"></div>

<div class="controls">
  <button class="mic" id="micBtn">🎤 Слушать</button>
  <button id="clearBtn">✕</button>
</div>

<script>
const USER_NAME = "сэр";
const LANG = "ru-RU";
const logEl = document.getElementById('log');
const micBtn = document.getElementById('micBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');
const coreEl = document.getElementById('core');

const synth = window.speechSynthesis;
let ruVoice = null;
function pickVoice() {
  const voices = synth.getVoices();
  ruVoice = voices.find(v => v.lang.startsWith('ru')) || voices.find(v => v.lang.startsWith('en')) || voices[0];
}
pickVoice(); synth.onvoiceschanged = pickVoice;

function speak(text) {
  if (!text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANG; u.voice = ruVoice; u.rate = 1.05; u.pitch = 0.85;
  u.onstart = () => coreEl.classList.add('speaking');
  u.onend = () => coreEl.classList.remove('speaking');
  synth.speak(u);
  addLog('jarvis', text);
}
function addLog(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const prefix = who === 'user' ? '👤 ' : who === 'jarvis' ? '🤖 ' : 'ℹ️ ';
  div.textContent = prefix + text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false;
if (SR) {
  recognition = new SR();
  recognition.lang = LANG;
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = () => { listening = true; micBtn.classList.add('active'); micBtn.textContent = '⏹ Стоп'; statusEl.textContent = 'СЛУШАЮ...'; coreEl.classList.add('listening'); };
  recognition.onend = () => { listening = false; micBtn.classList.remove('active'); micBtn.textContent = '🎤 Слушать'; statusEl.textContent = 'НАЖМИТЕ КНОПКУ И ГОВОРИТЕ'; coreEl.classList.remove('listening'); };
  recognition.onerror = (e) => { if (e.error === 'no-speech') addLog('sys', 'Ничего не услышал'); else addLog('sys', 'Ошибка: ' + e.error); };
  recognition.onresult = (e) => { const text = e.results[0][0].transcript.trim(); if (text) handleCommand(text); };
} else {
  micBtn.disabled = true; statusEl.textContent = 'БРАУЗЕР НЕ ПОДДЕРЖИВАЕТ ГОЛОС';
}
micBtn.onclick = () => { if (!recognition) return; if (listening) recognition.stop(); else { synth.cancel(); recognition.start(); } };
clearBtn.onclick = () => { logEl.innerHTML = ''; };

function handleCommand(raw) {
  const text = raw.toLowerCase().trim();
  addLog('user', raw);

  if (/(привет|здравствуй|хай|добрый (день|вечер|утро))/.test(text)) {
    const h = new Date().getHours();
    const greet = h < 6 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
    return speak(`${greet}, ${USER_NAME}. Чем могу помочь?`);
  }
  if (/(сколько времени|который час|время)/.test(text)) {
    const d = new Date();
    return speak(`Сейчас ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`);
  }
  if (/(какое.*число|какая.*дата|какой.*день)/.test(text)) {
    const d = new Date();
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    return speak(`Сегодня ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} года, ${days[d.getDay()]}`);
  }
  const openMatch = text.match(/(?:открой|запусти|перейди на)\s+(.+)/);
  if (openMatch) {
    const site = openMatch[1].trim();
    const map = { 'ютуб':'https://youtube.com','youtube':'https://youtube.com','вк':'https://vk.com','vk':'https://vk.com','телеграм':'https://web.telegram.org','telegram':'https://web.telegram.org','гугл':'https://google.com','google':'https://google.com','яндекс':'https://ya.ru','yandex':'https://ya.ru' };
    const url = map[site] || `https://${site.replace(/\s/g,'')}.com`;
    speak(`Открываю ${site}`);
    setTimeout(() => window.open(url, '_blank'), 700);
    return;
  }
  const searchMatch = text.match(/(?:найди|поищи|погугли|загугли)\s+(.+)/);
  if (searchMatch) { speak(`Ищу ${searchMatch[1]}`); setTimeout(() => window.open(`https://www.google.com/search?q=${encodeURIComponent(searchMatch[1])}`, '_blank'), 700); return; }
  const ytMatch = text.match(/(?:включи|врубай|поставь)\s+(.+)/);
  if (ytMatch) { speak(`Включаю ${ytMatch[1]} на YouTube`); setTimeout(() => window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(ytMatch[1])}`, '_blank'), 700); return; }
  if (/погод/.test(text)) { speak('Открываю прогноз погоды'); setTimeout(() => window.open('https://yandex.ru/pogoda', '_blank'), 700); return; }
  const timerMatch = text.match(/(?:таймер|напомни через)\s+(?:на\s+)?(\d+)\s*(секунд|минут|час)/);
  if (timerMatch) {
    const n = parseInt(timerMatch[1]); const unit = timerMatch[2];
    const sec = unit.startsWith('сек') ? n : unit.startsWith('мин') ? n*60 : n*3600;
    speak(`Таймер на ${n} ${unit} запущен`);
    setTimeout(() => { speak(`Таймер на ${n} ${unit} завершён, ${USER_NAME}`); if (navigator.vibrate) navigator.vibrate([300,100,300,100,300]); }, sec * 1000);
    return;
  }
  const calcMatch = text.match(/(\d+)\s*(плюс|минус|умножить на|разделить на)\s*(\d+)/);
  if (calcMatch) {
    const a = +calcMatch[1], b = +calcMatch[3], op = calcMatch[2];
    let r;
    if (op === 'плюс') r = a + b; else if (op === 'минус') r = a - b; else if (op.startsWith('умножить')) r = a * b; else if (op.startsWith('разделить')) r = b === 0 ? null : a / b;
    return speak(r === null ? 'На ноль делить нельзя' : `${a} ${op} ${b} равно ${r}`);
  }
  if (/(шутк|анекдот|рассмеши)/.test(text)) {
    const jokes = ['Почему программисты путают Хэллоуин и Рождество? Потому что Oct 31 = Dec 25.','Есть 10 типов людей: те, кто понимает двоичную систему, и те, кто нет.','Я бы рассказал шутку про UDP, но не уверен, что она до вас дойдёт.'];
    return speak(jokes[Math.floor(Math.random()*jokes.length)]);
  }
  if (/(как дела|как ты|ты тут)/.test(text)) return speak(`Все системы работают штатно, ${USER_NAME}. Готов к работе.`);
  if (/(как тебя зовут|кто ты)/.test(text)) return speak('Я Джарвис — ваш персональный ассистент.');
  if (/(стоп|замолчи|тихо|хватит)/.test(text)) { synth.cancel(); return; }
  speak(`Не уверен, что понял вас, ${USER_NAME}. Скажите: открой YouTube, найди что-нибудь, поставь таймер, скажи время.`);
}

window.addEventListener('load', () => {
  addLog('sys', 'Система Jarvis загружена');
  setTimeout(() => speak(`Здравствуйте, ${USER_NAME}. Джарвис к вашим услугам.`), 600);
});
</script>
</body>
</html>
