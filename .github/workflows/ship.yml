name: Build Jarvis APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: digreatbrian/buildozer-action@main
        id: buildozer
        with:
          work-dir: .
          buildozer-cmd: android debug
          python-version: "3.10"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildozer-logs
          path: .buildozer/android/platform/build-*/build.log
          if-no-files-found: warn

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build${{ github.run_number }}
          name: Jarvis Build ${{ github.run_number }}
          files: bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
