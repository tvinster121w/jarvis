name: Build Jarvis APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          allow-prereleases: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip
          sudo apt-get install -y openjdk-17-jdk
          sudo apt-get install -y autoconf libtool pkg-config
          sudo apt-get install -y zlib1g-dev libncurses5-dev
          sudo apt-get install -y libncursesw5-dev libtinfo5
          sudo apt-get install -y cmake libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tail -150

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build${{ github.run_number }}
          name: Jarvis Build ${{ github.run_number }}
          files: bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
